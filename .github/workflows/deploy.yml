name: Build and deploy site

# Builds the CV (HTML + PDF + 2-page resume) from cv/ and the publication list,
# builds the Jekyll site, and deploys to GitHub Pages.
# One-off setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1" # Mondays: refresh cached Scholar metrics
  workflow_dispatch:

permissions:
  contents: write # commit refreshed Scholar metrics
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi (default, cv and site environments)
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: default cv site
          cache: true

      - name: Unit tests (scripts)
        run: pixi run test

      - name: Refresh Scholar metrics (cached JSON is kept if Scholar blocks the request)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pip install scholarly
          python scripts/update_scholar_metrics.py

      - name: Publications -> CV article table
        run: pixi run python scripts/bib_to_cv.py

      - name: Install Chrome (for PDF export)
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Render CV and resume
        env:
          PAGEDOWN_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: pixi run -e cv cv

      - name: Install gems
        run: pixi run -e site gems

      - name: Build site
        run: pixi run -e site build

      - name: Purge unused CSS
        run: pixi run -e site -- npx --yes purgecss@7 -c purgecss.config.js

      - name: Commit refreshed Scholar metrics
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _data/scholar_metrics.json
          git diff --staged --quiet || (git commit -m "Update cached Google Scholar metrics" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
